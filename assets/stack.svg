<svg xmlns="http://www.w3.org/2000/svg" width="840" height="164" viewBox="0 0 840 164" role="img" aria-label="Stack. security: kali · nmap · burp suite · metasploit · wireshark. backend: python · node · java · fastapi · postgresql. frontend: typescript · react · next.js · tailwind"><style>
