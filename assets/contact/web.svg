<svg xmlns="http://www.w3.org/2000/svg" width="280" height="96" viewBox="0 0 280 96" role="img" aria-label="web: raigon.dev"><style>
text{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;white-space:pre}
.in{opacity:0;animation:in .3s ease-out forwards}
.grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow .7s cubic-bezier(.2,.7,.2,1) forwards}
.cover{transform-box:fill-box;transform-origin:right;animation-fill-mode:forwards;animation-name:type}
.blink{animation:blink 1.06s steps(1) infinite}
@keyframes in{to{opacity:1}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes type{to{transform:scaleX(0)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}.grow{transform:none}.cover{display:none}}
</style>
<rect width="280" height="96" fill="#0a0c0f"/>
<rect x="14" y="14" width="252" height="68" rx="6" fill="none" stroke="#2a3038"/><rect x="28" y="6" width="55" height="16" fill="#0a0c0f"/><text x="36" y="18.5" fill="#4ade80" font-size="13" font-weight="600"> web </text><rect x="228" y="6" width="24" height="16" fill="#0a0c0f"/><text x="244" y="18.5" text-anchor="end" fill="#6b737d" font-size="13">↗</text><text x="30.0" y="60" textLength="121.4" lengthAdjust="spacing" font-size="12.5"><tspan fill="#4ade80">$ </tspan><tspan fill="#c3c8ce">open raigon.dev</tspan></text><rect class="cover" x="43.3" y="47.5" width="111.1" height="18.5" fill="#0a0c0f" style="animation-duration:0.45s;animation-timing-function:steps(15);animation-delay:0.40s"/>
</svg>
