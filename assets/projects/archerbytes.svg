<svg xmlns="http://www.w3.org/2000/svg" width="420" height="176" viewBox="0 0 420 176" role="img" aria-label="archerbytes: knowledge-sharing platform for 20,000+ DLSU students. Built with next.js · postgresql · drizzle."><style>
text{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;white-space:pre}
.in{opacity:0;animation:in .3s ease-out forwards}
.grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow .7s cubic-bezier(.2,.7,.2,1) forwards}
.cover{transform-box:fill-box;transform-origin:right;animation-fill-mode:forwards;animation-name:type}
.blink{animation:blink 1.06s steps(1) infinite}
@keyframes in{to{opacity:1}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes type{to{transform:scaleX(0)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}.grow{transform:none}.cover{display:none}}
</style>
<rect width="420" height="176" fill="#0a0c0f"/>
<rect x="14" y="14" width="392" height="148" rx="6" fill="none" stroke="#2a3038"/><rect x="28" y="6" width="117" height="16" fill="#0a0c0f"/><text x="36" y="18.5" fill="#4ade80" font-size="13" font-weight="600"> archerbytes </text><rect x="321" y="6" width="71" height="16" fill="#0a0c0f"/><text x="384" y="18.5" text-anchor="end" fill="#6b737d" font-size="13">backend</text><text x="34.0" y="58" textLength="170.9" lengthAdjust="spacing" font-size="13"><tspan fill="#4ade80">$ </tspan><tspan fill="#6b737d">./archerbytes --about</tspan></text><rect class="cover" x="47.9" y="45" width="160.0" height="19" fill="#0a0c0f" style="animation-duration:0.74s;animation-timing-function:steps(21);animation-delay:0.85s"/><text class="in" style="animation-delay:1.79s" x="34" y="88" fill="#eceef1" font-size="16">knowledge-sharing platform</text><text class="in" style="animation-delay:1.91s" x="34" y="112" fill="#eceef1" font-size="16">for 20,000+ DLSU students</text><text class="in" style="animation-delay:2.12s" x="34" y="144" fill="#6b737d" font-size="12.5"># next.js · postgresql · drizzle</text><text class="in" style="animation-delay:2.23s" x="386" y="144" text-anchor="end" fill="#4ade80" font-size="14">→</text>
</svg>
