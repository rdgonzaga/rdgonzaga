name: Render profile

on:
  schedule:
    - cron: "0 */6 * * *" # stats + music
    - cron: "30 * * * *" # music
    - cron: "0 1-5,7-11,13-17,19-23 * * *" # music, skipping the stats hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/render.py", ".github/workflows/render.yml"]

permissions:
  contents: write

# runs rebuild `output` from its current files, so they must not overlap
concurrency:
  group: output
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # STATS_TOKEN (a PAT with read:user) lets private contributions count;
      # without it the default token only sees public activity
      - name: Render stats
        id: stats
        if: github.event_name != 'schedule' || github.event.schedule == '0 */6 * * *'
        continue-on-error: true
        run: python .github/scripts/render.py stats
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render music
        id: music
        continue-on-error: true
        run: python .github/scripts/render.py music
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      # `output` is an orphan branch force-pushed as a single commit, so the
      # refreshes never pile up in history. Start from what's there and swap in
      # only the cards rendered this run, so a failed fetch keeps the old card
      - name: Publish to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=$(mktemp -d)
          if git fetch -q --depth=1 origin output; then
            git archive FETCH_HEAD | tar -x -C "$out"
          fi
          fresh=0
          for f in stats music; do
            if [ -f "assets/$f.svg" ]; then
              cp "assets/$f.svg" "$out/"
              fresh=1
            fi
          done
          if [ "$fresh" = 0 ]; then
            echo "Nothing rendered"
            exit 0
          fi
          cd "$out"
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: refresh profile cards"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
      - name: Fail if a render failed
        if: steps.stats.outcome == 'failure' || steps.music.outcome == 'failure'
        run: exit 1
