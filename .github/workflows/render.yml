name: Render profile

# the music card is live on Vercel (api/music.py); this only refreshes stats
on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cards/render.py", ".github/workflows/render.yml"]

permissions:
  contents: write

concurrency:
  group: output
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # STATS_TOKEN (a PAT with read:user) lets private contributions count;
      # without it the default token only sees public activity
      - run: python cards/render.py stats
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # stats.svg lives on an orphan `output` branch that's force-pushed as a
      # single commit, so refreshes never pile up in main's history. If the
      # render above fails this step is skipped and the old card stays up
      - name: Publish stats to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=$(mktemp -d)
          cp assets/stats.svg "$out/"
          cd "$out"
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git commit -q -m "chore: refresh profile stats"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
